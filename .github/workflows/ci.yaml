name: CI

on: [push, pull_request]

jobs:
  direct:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool
          HOMEBREW_NO_AUTO_UPDATE=1 brew list
          autoreconf -i
          ./configure CC=clang
          make

      - name: Run tests
        run: |
          export REF_PATH=':'
          make test
